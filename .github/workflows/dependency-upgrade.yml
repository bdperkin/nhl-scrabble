# ============================================================================
# Automated Dependency Upgrade Workflow
# ============================================================================
# Automatically checks for dependency updates weekly and creates a PR with
# upgraded lock files when updates are available.
#
# Triggers:
#   - Weekly schedule: Mondays at 9 AM UTC
#   - Manual dispatch: Can be triggered manually via GitHub UI
#
# Process:
#   1. Upgrades all lock files (uv.lock, qa/web/uv.lock)
#   2. Runs quality checks (mypy, ruff, tests)
#   3. Creates PR if changes detected
#   4. PR title includes count of updated packages
#
# Security:
#   - Uses GITHUB_TOKEN with minimal permissions
#   - Only runs on main repository (not forks)
#   - Creates branch with consistent naming
#
# Related:
#   - scripts/upgrade_lock_files.sh - Lock file upgrade logic
#   - Makefile targets: lock-upgrade, lock-check, lock-outdated
#   - Pre-commit hook: upgrade-lock-files
# ============================================================================

name: Automated Dependency Upgrade

on:
  # Weekly on Mondays at 9 AM UTC (4 AM ET, 5 AM EDT)
  schedule:
    - cron: '0 9 * * 1'

  # Manual trigger
  workflow_dispatch:
    inputs:
      create_pr:
        description: 'Create PR if updates available'
        required: false
        default: true
        type: boolean

# Minimal permissions
permissions:
  contents: write
  pull-requests: write

# Only run on main repository (not forks)
concurrency:
  group: dependency-upgrade
  cancel-in-progress: false

jobs:
  upgrade-dependencies:
    name: Upgrade Dependencies
    runs-on: ubuntu-latest
    if: github.repository == 'bdperkin/nhl-scrabble'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for version detection

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install UV
        uses: astral-sh/setup-uv@v5
        with:
          version: 'latest'
          enable-cache: true

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create upgrade branch
        id: branch
        run: |
          BRANCH_NAME="automated/dependency-upgrade-$(date +%Y%m%d)"
          echo "branch=${BRANCH_NAME}" >> "$GITHUB_OUTPUT"

          # Delete branch if it exists (from previous run)
          git push origin --delete "${BRANCH_NAME}" 2>/dev/null || true

          # Create new branch
          git checkout -b "${BRANCH_NAME}"

      - name: Backup lock files
        run: |
          cp uv.lock uv.lock.backup
          cp qa/web/uv.lock qa/web/uv.lock.backup

      - name: Upgrade lock files
        id: upgrade
        run: |
          # Run upgrade script
          bash scripts/upgrade_lock_files.sh --upgrade

          # Check if any changes were made
          if ! git diff --quiet uv.lock qa/web/uv.lock; then
            echo "changes=true" >> "$GITHUB_OUTPUT"

            # Count updated packages in main lock file
            MAIN_UPDATES=$(
              diff -u uv.lock.backup uv.lock | \
              grep -c "^[-+]" | \
              grep -v "^[-+][-+][-+]" || echo "0"
            )

            # Count updated packages in QA web lock file
            QA_UPDATES=$(
              diff -u qa/web/uv.lock.backup qa/web/uv.lock | \
              grep -c "^[-+]" | \
              grep -v "^[-+][-+][-+]" || echo "0"
            )

            TOTAL_UPDATES=$((MAIN_UPDATES + QA_UPDATES))
            echo "update_count=${TOTAL_UPDATES}" >> "$GITHUB_OUTPUT"

            # Extract updated package names
            UPDATED_PACKAGES=$(
              diff -u uv.lock.backup uv.lock | \
              grep "^[-+]" | \
              grep -v "^[-+][-+][-+]" | \
              sed 's/^[-+]//' | \
              sort -u | \
              head -10 | \
              paste -sd "," -
            )
            echo "updated_packages=${UPDATED_PACKAGES}" >> "$GITHUB_OUTPUT"
          else
            echo "changes=false" >> "$GITHUB_OUTPUT"
            echo "update_count=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies for testing
        if: steps.upgrade.outputs.changes == 'true'
        run: |
          uv pip install --system \
            -e ".[dev,type,lint,test,security,export,i18n,docs]"

      - name: Run quick quality checks
        if: steps.upgrade.outputs.changes == 'true'
        run: |
          # Type checking
          mypy src

          # Linting
          ruff check src

          # Quick test suite (not full tox)
          pytest tests/unit -x --tb=short --maxfail=5

      - name: Commit changes
        if: steps.upgrade.outputs.changes == 'true'
        run: |
          git add uv.lock qa/web/uv.lock

          cat > commit_message.txt <<'EOF'
          chore(deps): automated dependency upgrade

          Automated weekly dependency upgrade to latest compatible versions.

          Updated packages: ${{ steps.upgrade.outputs.update_count }}

          Lock files updated:
          - uv.lock (main project)
          - qa/web/uv.lock (QA web app)

          Quality checks passed:
          - ✅ Type checking (mypy)
          - ✅ Linting (ruff)
          - ✅ Unit tests

          This PR was automatically created by the dependency-upgrade workflow.
          EOF

          git commit -F commit_message.txt

      - name: Push branch
        if: steps.upgrade.outputs.changes == 'true'
        run: |
          git push -u origin "${{ steps.branch.outputs.branch }}"

      - name: Create Pull Request
        if: |
          steps.upgrade.outputs.changes == 'true' &&
          (github.event_name == 'schedule' || inputs.create_pr)
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ steps.branch.outputs.branch }}
          title: >-
            chore(deps): Automated dependency upgrade
            (${{ steps.upgrade.outputs.update_count }} packages)
          body: |
            ## 🔄 Automated Dependency Upgrade

            This PR upgrades all dependencies to their latest compatible versions.

            ### 📊 Summary

            - **Updated packages**: ${{ steps.upgrade.outputs.update_count }}
            - **Lock files**: `uv.lock`, `qa/web/uv.lock`
            - **Trigger**:
              ${{ github.event_name == 'schedule' &&
              'Weekly schedule' || 'Manual dispatch' }}

            ### ✅ Quality Checks

            - ✅ Type checking (mypy)
            - ✅ Linting (ruff)
            - ✅ Unit tests

            ### 📦 Changes

            Lock files have been upgraded to use the latest compatible versions of all dependencies.

            ### 🔍 Review Checklist

            - [ ] Review updated package versions
            - [ ] Check CI test results
            - [ ] Verify no breaking changes in changelogs
            - [ ] Merge when all checks pass

            ### 🤖 Automation

            This PR was automatically created by the
            `dependency-upgrade` workflow.

            - Workflow:
              `.github/workflows/dependency-upgrade.yml`
            - Script: `scripts/upgrade_lock_files.sh`
            - Make target: `make lock-upgrade`
          labels: dependencies,automated
          assignees: bdperkin
          draft: false

      - name: Summary
        run: |
          if [[ "${{ steps.upgrade.outputs.changes }}" == "true" ]]; then
            echo "✅ Dependencies upgraded successfully"
            echo "📦 Updated ${{ steps.upgrade.outputs.update_count }} packages"
            echo "🔗 PR created: ${{ steps.branch.outputs.branch }}"
          else
            echo "ℹ️  No dependency updates available"
          fi
